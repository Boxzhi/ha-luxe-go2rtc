name: Build and publish Luxe go2rtc Recording POC

on:
  push:
    branches:
      - main
    paths:
      - "luxe-go2rtc-recording-poc/**"
      - ".github/workflows/recording-poc.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: luxe-go2rtc-recording-poc-image
  cancel-in-progress: true

jobs:
  build-amd64:
    name: Build isolated recording POC image
    runs-on: ubuntu-latest
    steps:
      - name: Check out add-on repository
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: owner
        shell: bash
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push POC image
        uses: docker/build-push-action@v6
        with:
          context: ./luxe-go2rtc-recording-poc
          file: ./luxe-go2rtc-recording-poc/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/ha-luxe-go2rtc-recording-poc-amd64:1.9.15-luxe-poc.10
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published POC container
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ steps.owner.outputs.name }}/ha-luxe-go2rtc-recording-poc-amd64:1.9.15-luxe-poc.10"
          docker pull "$image"
          docker rm -f luxe-recording-poc-smoke >/dev/null 2>&1 || true
          docker run -d --name luxe-recording-poc-smoke --network host "$image"
          cleanup() {
            docker logs luxe-recording-poc-smoke || true
            docker rm -f luxe-recording-poc-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:1985/recording-poc.html -o /tmp/recording-poc.html; then
              break
            fi
            sleep 1
          done

          grep -q "Luxe 原生录像下载 POC" /tmp/recording-poc.html
          curl -fsS http://127.0.0.1:1985/recording-poc.js -o /tmp/recording-poc.js
          grep -q "startNativeDownload" /tmp/recording-poc.js
          ! grep -Eq "new Blob|createObjectURL|navigator\.storage" /tmp/recording-poc.js

          curl -fsS http://127.0.0.1:1985/recording-opfs-poc.html -o /tmp/recording-opfs-poc.html
          grep -q "Luxe OPFS 流式下载 POC" /tmp/recording-opfs-poc.html
          curl -fsS http://127.0.0.1:1985/recording-wkdownload-poc.html -o /tmp/recording-wkdownload-poc.html
          grep -q "Luxe WKDownload 原生附件下载 POC" /tmp/recording-wkdownload-poc.html
          grep -q 'download="luxe-wkdownload-poc-16mib.bin"' /tmp/recording-wkdownload-poc.html

          curl -fsS http://127.0.0.1:1985/recording-opfs-wkdownload-poc.html -o /tmp/recording-opfs-wkdownload-poc.html
          grep -q "Luxe OPFS → WKDownload 集成 POC" /tmp/recording-opfs-wkdownload-poc.html
          curl -fsS http://127.0.0.1:1985/recording-opfs-wkdownload-poc.js -o /tmp/recording-opfs-wkdownload-poc.js
          grep -q "创建中转任务" /tmp/recording-opfs-wkdownload-poc.js
          grep -q "download_started" /tmp/recording-opfs-wkdownload-poc.js
          curl -fsS http://127.0.0.1:1985/recording-opfs-relay-worker.js -o /tmp/recording-opfs-relay-worker.js
          grep -q "CHUNK_SIZE = 256 \* 1024" /tmp/recording-opfs-relay-worker.js
          ! grep -Eqi 'new[[:space:]]+Blob|createObjectURL|arrayBuffer[(]|new[[:space:]]+File' /tmp/recording-opfs-wkdownload-poc.js /tmp/recording-opfs-relay-worker.js

          curl -fsS http://127.0.0.1:1985/recording-opfs-safari-poc.html -o /tmp/recording-opfs-safari-poc.html
          grep -q "Luxe Safari OPFS 三路并发下载 POC" /tmp/recording-opfs-safari-poc.html
          grep -q 'src="recording-opfs-safari-poc.js"' /tmp/recording-opfs-safari-poc.html
          curl -fsS http://127.0.0.1:1985/recording-opfs-safari-poc.js -o /tmp/recording-opfs-safari-poc.js
          grep -q 'anchor.download = record.fileName' /tmp/recording-opfs-safari-poc.js
          grep -q '请使用 iPhone / iPad / Mac 的 Safari' /tmp/recording-opfs-safari-poc.js
          ! grep -Eqi 'new[[:space:]]+Blob|createObjectURL|arrayBuffer[(]|new[[:space:]]+File' /tmp/recording-opfs-safari-poc.js
          grep -q 'recording-opfs-safari-poc.html' /tmp/recording-opfs-sw.js

          curl -fsS http://127.0.0.1:1985/recording-opfs-poc.js -o /tmp/recording-opfs-poc.js
          curl -fsS http://127.0.0.1:1985/recording-opfs-worker.js -o /tmp/recording-opfs-worker.js
          curl -fsS http://127.0.0.1:1985/recording-opfs-sw.js -o /tmp/recording-opfs-sw.js
          ! grep -Eqi 'new[[:space:]]+Blob|createObjectURL|arrayBuffer' /tmp/recording-opfs-poc.js /tmp/recording-opfs-worker.js /tmp/recording-opfs-sw.js
          ! grep -Fq 'getFile()' /tmp/recording-opfs-poc.js /tmp/recording-opfs-worker.js /tmp/recording-opfs-sw.js
          grep -q 'createSyncAccessHandle' /tmp/recording-opfs-worker.js
          grep -q 'LUXE_OPFS_DOWNLOAD_REQUEST' /tmp/recording-opfs-sw.js
          grep -q 'MessageChannel' /tmp/recording-opfs-sw.js

          status=$(curl -sS -o /tmp/recording-wkdownload-auth.json -w "%{http_code}" http://127.0.0.1:1985/api/luxe/recording-poc/download)
          test "$status" = "401"
          grep -q "Home Assistant Bearer token required" /tmp/recording-wkdownload-auth.json

          status=$(curl -sS -o /tmp/recording-relay-auth.json -w "%{http_code}" -X POST http://127.0.0.1:1985/api/luxe/recording-poc/relay -H "Content-Type: application/json" -d '{}')
          test "$status" = "401"
          grep -q "Home Assistant Bearer token required" /tmp/recording-relay-auth.json

          status=$(curl -sS -o /tmp/recording-auth.json -w "%{http_code}" http://127.0.0.1:1985/api/luxe/recordings)
          test "$status" = "401"
          grep -q "Home Assistant Bearer token required" /tmp/recording-auth.json
