name: Build and publish Luxe go2rtc Recording POC

on:
  push:
    branches:
      - main
    paths:
      - "luxe-go2rtc-recording-poc/**"
      - ".github/workflows/recording-poc.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: luxe-go2rtc-recording-poc-image
  cancel-in-progress: true

jobs:
  build-amd64:
    name: Build isolated recording POC image
    runs-on: ubuntu-latest
    steps:
      - name: Check out add-on repository
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: owner
        shell: bash
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push POC image
        uses: docker/build-push-action@v6
        with:
          context: ./luxe-go2rtc-recording-poc
          file: ./luxe-go2rtc-recording-poc/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/ha-luxe-go2rtc-recording-poc-amd64:1.9.15-luxe-poc.3
            ghcr.io/${{ steps.owner.outputs.name }}/ha-luxe-go2rtc-recording-poc-amd64:recording-poc
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published POC container
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ steps.owner.outputs.name }}/ha-luxe-go2rtc-recording-poc-amd64:1.9.15-luxe-poc.3"
          docker pull "$image"
          docker rm -f luxe-recording-poc-smoke >/dev/null 2>&1 || true
          docker run -d --name luxe-recording-poc-smoke --network host "$image"
          cleanup() {
            docker logs luxe-recording-poc-smoke || true
            docker rm -f luxe-recording-poc-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:1985/recording-poc.html -o /tmp/recording-poc.html; then
              break
            fi
            sleep 1
          done

          grep -q "Luxe 原生录像下载 POC" /tmp/recording-poc.html
          curl -fsS http://127.0.0.1:1985/recording-poc.js -o /tmp/recording-poc.js
          grep -q "startNativeDownload" /tmp/recording-poc.js
          ! grep -Eq "new Blob|createObjectURL|navigator\.storage" /tmp/recording-poc.js

          status=$(curl -sS -o /tmp/recording-auth.json -w "%{http_code}" http://127.0.0.1:1985/api/luxe/recordings)
          test "$status" = "401"
          grep -q "Home Assistant Bearer token required" /tmp/recording-auth.json
