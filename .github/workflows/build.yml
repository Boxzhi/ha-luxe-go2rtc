name: Build and publish Luxe go2rtc

on:
  push:
    branches:
      - main
    paths:
      - "luxe-go2rtc/**"
      - ".github/workflows/build.yml"
      - "repository.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: luxe-go2rtc-image
  cancel-in-progress: true

jobs:
  build-amd64:
    name: Build Linux AMD64 add-on image
    runs-on: ubuntu-latest
    steps:
      - name: Check out add-on repository
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: owner
        shell: bash
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./luxe-go2rtc
          file: ./luxe-go2rtc/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/ha-luxe-go2rtc-amd64:1.9.15-luxe.3
            ghcr.io/${{ steps.owner.outputs.name }}/ha-luxe-go2rtc-amd64:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
